name: RDP with Hyper-V

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Check Windows Environment
        run: |
          echo "Runner OS: $env:ImageOS"
          echo "Runner Version: $env:ImageVersion"
          systeminfo | findstr /C:"OS Name" /C:"OS Version"

      - name: Configure RDP
        run: |
          # Enable Remote Desktop
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          
          # Allow connections without NLA
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          
          # Open firewall port
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389

      - name: Check Virtualization Features
        run: |
          # Show available features
          $features = Get-WindowsOptionalFeature -Online
          $hyperFeatures = $features | Where-Object { $_.FeatureName -match "Hyper|Virtual|Container" }
          $hyperFeatures | Select-Object FeatureName, State | Format-Table -AutoSize

      - name: Enable Required Features
        run: |
          # Try to enable common virtualization features
          $featuresToEnable = @(
            "Microsoft-Hyper-V",
            "HypervisorPlatform",
            "VirtualMachinePlatform",
            "Containers"
          )
          
          foreach ($feature in $featuresToEnable) {
            try {
              $status = Get-WindowsOptionalFeature -Online -FeatureName $feature -ErrorAction SilentlyContinue
              if ($status -and $status.State -ne "Enabled") {
                Enable-WindowsOptionalFeature -Online -FeatureName $feature -All -NoRestart | Out-Null
                Write-Host "Enabled: $feature"
              } else {
                Write-Host "Already enabled/skipped: $feature"
              }
            } catch {
              Write-Host "Could not enable: $feature"
            }
          }

      - name: Create RDP User Account
        run: |
          # Generate secure password
          Add-Type -AssemblyName System.Web
          $password = [System.Web.Security.Membership]::GeneratePassword(14, 3)
          
          # Store credentials
          echo "RDP_USER=AdminUser" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV
          
          # Create password object
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          # Create or update user
          try {
            New-LocalUser -Name "AdminUser" -Password $securePass -AccountNeverExpires -ErrorAction Stop
            Write-Host "User created: AdminUser"
          } catch {
            Set-LocalUser -Name "AdminUser" -Password $securePass
            Write-Host "User password updated: AdminUser"
          }
          
          # Add to required groups
          Add-LocalGroupMember -Group "Administrators" -Member "AdminUser" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "AdminUser" -ErrorAction SilentlyContinue

      - name: Install Tailscale VPN
        run: |
          # Download Tailscale
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-amd64.msi"
          $installer = "$env:TEMP\tailscale-setup.msi"
          
          Write-Host "Downloading Tailscale..."
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          
          # Install silently
          Write-Host "Installing Tailscale..."
          Start-Process msiexec.exe -Wait -NoNewWindow -ArgumentList @(
            "/i",
            "`"$installer`"",
            "/quiet",
            "/norestart",
            "REBOOT=ReallySuppress"
          )
          
          # Wait for installation
          Start-Sleep -Seconds 10
          
          # Cleanup
          Remove-Item $installer -Force -ErrorAction SilentlyContinue
          Write-Host "Tailscale installed"

      - name: Setup Tailscale Connection
        run: |
          # Check auth key
          if (-not "${{ secrets.TAILSCALE_AUTH_KEY }}") {
            Write-Error "ERROR: TAILSCALE_AUTH_KEY secret is not set"
            Write-Host "Please add TAILSCALE_AUTH_KEY to GitHub Secrets"
            exit 1
          }
          
          # Connect to Tailscale
          Write-Host "Connecting to Tailscale network..."
          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
            --hostname="github-win-$env:GITHUB_RUN_ID" `
            --accept-dns=false `
            --accept-routes=false
          
          # Get Tailscale IP
          Write-Host "Getting Tailscale IP..."
          $ip = $null
          for ($i = 1; $i -le 15; $i++) {
            $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4 2>$null
            if ($ip -and $ip -match '^100\.') {
              break
            }
            Write-Host "Attempt $i/15 - Waiting for IP..."
            Start-Sleep -Seconds 2
          }
          
          if (-not $ip) {
            Write-Error "Failed to get Tailscale IP"
            & "C:\Program Files\Tailscale\tailscale.exe" status
            exit 1
          }
          
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "✓ Tailscale IP: $ip"

      - name: Verify RDP Setup
        run: |
          # Ensure RDP service is running
          $service = Get-Service TermService -ErrorAction SilentlyContinue
          if ($service.Status -ne "Running") {
            Start-Service TermService
            Start-Sleep -Seconds 3
          }
          Write-Host "RDP Service: $($service.Status)"
          
          # Test port locally
          try {
            $test = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue
            if ($test.TcpTestSucceeded) {
              Write-Host "✓ RDP port 3389 is listening"
            } else {
              Write-Warning "RDP port test failed"
            }
          } catch {
            Write-Host "Port test completed"
          }

      - name: Show Connection Details
        run: |
          Write-Host ""
          Write-Host "┌─────────────────────────────────────────────────────┐"
          Write-Host "│            RDP CONNECTION INFORMATION              │"
          Write-Host "├─────────────────────────────────────────────────────┤"
          Write-Host "│                                                     │"
          Write-Host "│  IP Address:   $env:TAILSCALE_IP"
          Write-Host "│  Username:     $env:RDP_USER"
          Write-Host "│  Password:     $env:RDP_PASS"
          Write-Host "│                                                     │"
          Write-Host "│  Instructions:                                     │"
          Write-Host "│  1. Open Remote Desktop (mstsc.exe)                │"
          Write-Host "│  2. Enter the IP address above                     │"
          Write-Host "│  3. Use credentials shown                          │"
          Write-Host "│                                                     │"
          Write-Host "│  Session will run for 6 hours                      │"
          Write-Host "│                                                     │"
          Write-Host "└─────────────────────────────────────────────────────┘"
          Write-Host ""

      - name: Maintain RDP Session
        run: |
          $durationMinutes = 355  # 5 minutes less than timeout
          $checkInterval = 30     # Check every 30 seconds
          
          Write-Host "Maintaining RDP session for $durationMinutes minutes..."
          Write-Host "Press 'Cancel workflow' in GitHub to stop early."
          
          $startTime = Get-Date
          $endTime = $startTime.AddMinutes($durationMinutes)
          
          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)
            $remainingStr = "{0:D2}:{1:D2}:{2:D2}" -f `
              $remaining.Hours, `
              $remaining.Minutes, `
              $remaining.Seconds
            
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Active - Remaining: $remainingStr"
            
            # Keep services running
            Get-Service TermService, Tailscale | Start-Service -ErrorAction SilentlyContinue
            
            # Sleep
            Start-Sleep -Seconds $checkInterval
          }
          
          Write-Host "Session completed successfully."

      - name: Cleanup
        if: always()
        run: |
          Write-Host "Performing cleanup..."
          
          # Disable RDP
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 1 /f 2>$null
          
          # Remove firewall rule
          netsh advfirewall firewall delete rule name="RDP" 2>$null
          
          # Disconnect Tailscale
          & "C:\Program Files\Tailscale\tailscale.exe" down 2>$null
          
          Write-Host "Cleanup finished"
